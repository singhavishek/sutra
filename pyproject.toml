[project]
name = "sutra"
version = "0.0.1"
description = "Personal knowledge graph for code and engineering memory. Remembers what you worked on, what changed, and what worked."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Avishek Yadav", email = "yadav.avishek11@gmail.com" },
]
keywords = [
    "knowledge-graph",
    "mcp",
    "claude-code",
    "code-intelligence",
    "memory",
    "falkordb",
    "local-first",
    "developer-tools",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
]
# Runtime dependencies pinned carefully — Phase 0 minimum.
# Will grow as phases land. Keep this list honest; no speculative deps.
dependencies = [
    # CLI
    "typer>=0.12.0",
    "rich>=13.7.0",
    # Configuration
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "tomli>=2.0.0; python_version < '3.11'",
    # Graph database client
    "falkordb>=1.0.0",
    # Vector store
    "lancedb>=0.11.0",
    "pyarrow>=16.0.0",
    # Parsing
    "tree-sitter>=0.22.0",
    "tree-sitter-languages>=1.10.0",
    # Embeddings (local, MLX on Apple Silicon; sentence-transformers as fallback)
    "sentence-transformers>=3.0.0",
    # MCP server framework
    "mcp>=1.0.0",
    # Async + IO
    "anyio>=4.4.0",
    "watchfiles>=0.22.0",  # file watcher (optional in Phase 0, used Phase 2+)
    # Structured logging
    "structlog>=24.2.0",
]

[project.optional-dependencies]
mlx = [
    # Apple Silicon embedding acceleration (Phase 0+)
    "mlx>=0.18.0",
    "mlx-lm>=0.18.0",
]
dev = [
    # Linting / formatting
    "ruff>=0.6.0",
    # Type checking
    "mypy>=1.11.0",
    "types-toml>=0.10.8",
    # Testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.0",
    "hypothesis>=6.100.0",
    # Pre-commit hooks
    "pre-commit>=3.8.0",
    # Benchmarking (Phase 3+)
    "pytest-benchmark>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/singhavishek/sutra"
Repository = "https://github.com/singhavishek/sutra"
Issues = "https://github.com/singhavishek/sutra/issues"
Documentation = "https://github.com/singhavishek/sutra/blob/main/docs/sutra-architecture.md"

[project.scripts]
sutra = "sutra.cli:app"

# ──────────────────────────────────────────────────────────────────────────
# Build system
# ──────────────────────────────────────────────────────────────────────────
[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sutra"]

# ──────────────────────────────────────────────────────────────────────────
# uv (package + env management)
# ──────────────────────────────────────────────────────────────────────────
[tool.uv]
dev-dependencies = [
    # Mirrors optional-dependencies.dev; uv reads this for `uv sync`
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.0",
    "hypothesis>=6.100.0",
    "pre-commit>=3.8.0",
    "pytest-benchmark>=4.0.0",
]

# ──────────────────────────────────────────────────────────────────────────
# Ruff (linting + formatting)
# ──────────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs/", "scripts/"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "C4",  # comprehensions
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF", # ruff-specific
    "N",   # pep8-naming
    "S",   # bandit (security)
    "PL",  # pylint
    "PT",  # pytest-style
    "TID", # tidy imports
    "TCH", # type-checking
    "ERA", # no commented-out code
]
ignore = [
    "E501",    # line too long — ruff format handles
    "PLR0913", # too many arguments (graph tools have many kwargs)
    "S101",    # allow asserts in tests
    "PLR2004", # magic values (common in indexer thresholds)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "PLR", "PT011"]
"src/sutra/migrations/**/*.py" = ["E501", "N806"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ──────────────────────────────────────────────────────────────────────────
# mypy
# ──────────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "falkordb.*",
    "lancedb.*",
    "tree_sitter_languages.*",
    "mlx.*",
    "sentence_transformers.*",
]
ignore_missing_imports = true

# ──────────────────────────────────────────────────────────────────────────
# pytest
# ──────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src/sutra",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-fail-under=80",  # Phase 0 target; tune as needed
]
asyncio_mode = "auto"
markers = [
    "slow: tests that take >1s (skip with -m 'not slow')",
    "integration: requires FalkorDB / LanceDB running",
    "mcp: end-to-end MCP protocol tests",
]

[tool.coverage.run]
branch = true
source = ["src/sutra"]
omit = [
    "src/sutra/migrations/*",
    "src/sutra/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
